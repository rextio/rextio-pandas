name: CI

on:
  push:
    branches: [main, "0.1.1", "0.1.2"]
  pull_request:
    branches: [main, "0.1.1", "0.1.2"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests benchmarks
      - run: python -m mypy
      - run: python -m pytest -m 'not needs_cargo'
      - run: python -m build
      - run: python -m check_wheel_contents dist/*.whl

  core-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rextio: ["0.1.3", "0.1.4", "0.1.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "rextio==${{ matrix.rextio }}" pandas==2.3.3 numpy==2.3.5 pytest
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/test_plugin_contract.py tests/test_series_map.py -m 'not needs_cargo'
