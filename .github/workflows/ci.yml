name: CI

on:
  push:
    branches: [main, "0.1.1", "0.1.2"]
  pull_request:
    branches: [main, "0.1.1", "0.1.2"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests benchmarks
      - run: python -m mypy
      - run: python -m pytest -m 'not needs_cargo'
      - run: python -m build
      - run: python -m check_wheel_contents dist/*.whl

  core-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rextio: ["0.1.3", "0.1.4", "0.1.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "rextio==${{ matrix.rextio }}" pandas==2.3.3 numpy==2.3.5 pytest
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/test_plugin_contract.py tests/test_series_map.py -m 'not needs_cargo'

  native-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install rextio==0.1.5 pandas==2.3.3 numpy==2.3.5 pytest
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/e2e/test_series_map_real_cargo.py

  current-core-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rextio/rextio
          ref: "0.1.6"
          path: rextio-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./rextio-core pandas==2.3.3 numpy==2.3.5 pytest
      - run: python -m pip install --no-deps -e .
      - run: >-
          python -c "from rextio.plugins.api import PLUGIN_API_VERSION;
          assert PLUGIN_API_VERSION == '1.6', PLUGIN_API_VERSION"
      - run: >-
          python -m pytest tests/test_plugin_contract.py tests/test_series_map.py
          -m 'not needs_cargo'
      - run: python -m pytest tests/e2e/test_series_map_real_cargo.py
